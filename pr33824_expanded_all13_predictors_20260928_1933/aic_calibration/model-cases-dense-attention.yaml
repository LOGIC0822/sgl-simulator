schema_version: 1
architecture: A100PCIeSelectedDenseAttentionCalibration
description: >
  BF16 dense-attention model topologies read from the selected local checkpoint
  configurations, plus same-KV-head interpolation support shapes. All are
  measured on the local A100 PCIe with current-PR Triton attention in eager
  operation-collection mode.

