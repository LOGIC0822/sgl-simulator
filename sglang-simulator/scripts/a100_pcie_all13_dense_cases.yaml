      - fields: [batch_size, input_len, num_heads, num_key_value_heads, head_dim, use_fp8_kv_cache, use_fp8_context_fmha, is_context_phase, window_size]
        match: {batch_size: [1, 2, 4, 8, 16, 32], input_len: [1, 3, 7, 15, 31, 63, 127, 255, 511, 1023, 2047], num_heads: 32, num_key_value_heads: 8, head_dim: 128, use_fp8_kv_cache: false, use_fp8_context_fmha: false, is_context_phase: false, window_size: 0}
