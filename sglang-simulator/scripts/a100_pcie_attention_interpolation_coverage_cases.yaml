schema_version: 1
architecture: A100PCIeAttentionInterpolationCoverage
description: >
  Supplemental local A100 BF16 attention measurements for every attention
  topology in the 13-model matrix.  AIC Silicon interpolates each KV-head
  slice over (query-head count, sequence length, batch size), so the two
  support-only points 8/2 and 16/16 are included alongside real models.  They
  supply the missing query-head axis for Qwen2.5-3B (16/2) and Llama-2-7B
  (32/32, represented internally by AIC's MHA slice).

all_frameworks_op_cases:
  attention_context:
    rules:
      - fields: [batch_size, input_len, num_heads, num_key_value_heads, head_dim, use_fp8_kv_cache, use_fp8_context_fmha, is_context_phase, window_size]
        match: {batch_size: [1, 2, 4, 8, 16, 32], input_len: [1, 16, 32, 64, 128, 256, 512, 1024], num_heads: 8, num_key_value_heads: 2, head_dim: 128, use_fp8_kv_cache: false, use_fp8_context_fmha: false, is_context_phase: true, window_size: 0}
